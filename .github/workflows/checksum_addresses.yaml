name: Checksum Addresses

on:
  pull_request_target:
    paths:
      - 'config/*.json'
      - 'extras/*.json'

jobs:
  checksum-addresses:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      # scripts/ is on sys.path[0] when the script below runs, so any file the
      # PR planted there (e.g. a shadow eth_utils.py) would be imported instead
      # of the real dependency. Wipe the whole directory and restore it from
      # the trusted base ref before anything imports from it.
      - name: Reset scripts/ to trusted base version
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          rm -rf scripts
          git checkout "origin/$BASE_REF" -- scripts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install eth-utils "eth-hash[pycryptodome]"

      - name: Fix address checksums
        run: python scripts/validate_checksums.py --fix

      - name: Push fixes to PR branch
        run: |
          git checkout -- scripts/validate_checksums.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/*.json extras/*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: checksum addresses"
            git push
          fi
